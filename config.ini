; ==============================================================================
; 划词与多模态翻译助手配置文件 (config.ini)
; ==============================================================================

[General]
; 当前激活的翻译引擎：可填 Copilot 或 Gemini（默认 Copilot）
; 您可在屏幕右下角托盘图标中直接一键切换
ActiveEngine=Copilot

; 窗口展示模式：Mini（快捷迷你窗口）或 Full（完整独立大窗口），默认 Mini
; 您可在屏幕右下角托盘图标中随时一键切换
WindowMode=Full

[UserHotkey]
; 您日常触发翻译的全局快捷键（只需记这一个键，触发上面 ActiveEngine 设定的引擎）
; 快捷键格式：! 代表 Alt，^ 代表 Ctrl，+ 代表 Shift，# 代表 Win
; 默认建议 Alt + C（!c）
TranslateHotkey=!c

[AppHotkeys]
; 目标 AI 软件自身在 Windows 系统中的唤出快捷键（若软件快捷键改变，在此修改）
; Copilot 系统呼出键（Win11 默认为 Win + C，即 #c）
CopilotAppHotkey=#c

; Gemini 浮窗系统呼出键（Chrome/扩展默认为 Alt + G，即 !g）
GeminiAppHotkey=!g

[Settings]
; 唤起窗口后，等待界面就绪的延迟时间（毫秒）
CopilotDelayMs=600
GeminiDelayMs=600

; 纯文本翻译提示词模板（{text} 会自动替换为目标文本）
TextPromptTemplate=请将以下内容准确翻译为简体中文，保持自然流畅：`n`n{text}

; 截图翻译与 OCR 提示词（兼备高精度识字提取与翻译，方便直接复制代码或原文）
ImagePrompt=请先完整提取图片中的文字内容（保留代码与排版），随后将其准确翻译为简体中文：

; 文档/文件翻译提示词（当复制了 PDF、Word、TXT、图片等文件时调用）
FilePrompt=请阅读所附文件，并将其内容准确翻译为简体中文，保持自然流畅。
