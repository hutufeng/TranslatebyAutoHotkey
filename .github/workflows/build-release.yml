name: Build and Release TranslateAssistant

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment and Compile
        shell: pwsh
        run: |
          Write-Host "[*] 正在准备构建环境..."
          New-Item -ItemType Directory -Path "dist", "tools/ahk", "tools/compiler" -Force | Out-Null

          # 1. 动态获取 AutoHotkey v2 官方最新内核 (精准匹配版本资产，无硬编码)
          Write-Host "[*] 检索 AutoHotkey v2 官方最新内核..."
          $ahkApi = "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest"
          $ahkRelease = Invoke-RestMethod -Uri $ahkApi -Headers @{"User-Agent"="GitHubActions"}
          $ahkAsset = $ahkRelease.assets | Where-Object { $_.name -match '^AutoHotkey_[\d\.]+\.zip$' } | Select-Object -First 1
          Write-Host "[*] 正在下载 AutoHotkey 内核: $($ahkAsset.browser_download_url)"
          Invoke-WebRequest -Uri $ahkAsset.browser_download_url -OutFile "tools/ahk.zip" -UseBasicParsing
          Expand-Archive -Path "tools/ahk.zip" -DestinationPath "tools/ahk" -Force

          # 2. 动态获取 Ahk2Exe 官方最新编译器 (精准匹配版本资产，无硬编码)
          Write-Host "[*] 检索 Ahk2Exe 官方最新编译器..."
          $compilerApi = "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $compilerRelease = Invoke-RestMethod -Uri $compilerApi -Headers @{"User-Agent"="GitHubActions"}
          $compilerAsset = $compilerRelease.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          Write-Host "[*] 正在下载 Ahk2Exe 编译器: $($compilerAsset.browser_download_url)"
          Invoke-WebRequest -Uri $compilerAsset.browser_download_url -OutFile "tools/compiler.zip" -UseBasicParsing
          Expand-Archive -Path "tools/compiler.zip" -DestinationPath "tools/compiler" -Force

          # 3. 执行编译打包 (Ahk2Exe 是 GUI 程序，必须 -Wait 等待编译完成)
          Write-Host "[*] 正在将 TranslateAssistant.ah2 编译为单文件 exe..."
          $compiler = (Resolve-Path "tools/compiler/Ahk2Exe.exe").Path
          $baseAhk = (Resolve-Path "tools/ahk/AutoHotkey64.exe").Path
          $inScript = (Resolve-Path "TranslateAssistant.ah2").Path
          $outExe = (Join-Path $PWD "dist/TranslateAssistant.exe")
          
          $proc = Start-Process -FilePath $compiler -ArgumentList "/in `"$inScript`" /out `"$outExe`" /base `"$baseAhk`"" -PassThru -Wait -NoNewWindow
          
          # 等待文件完全写入与句柄释放
          $retry = 0
          while (-not (Test-Path $outExe) -and $retry -lt 15) {
              Start-Sleep -Seconds 1
              $retry++
          }

          if (-not (Test-Path $outExe)) {
              Write-Error "Ahk2Exe 编译失败，未生成 $outExe"
              exit 1
          }
          
          $exeSize = (Get-Item $outExe).Length
          Write-Host "[√] 编译成功: $outExe (大小: $exeSize 字节)"

          # 4. 拷贝配置文件到发布包中
          Copy-Item "config.ini" -Destination "dist/config.ini" -Force

          # 5. 打包为绿色便携 zip 压缩包
          $zipName = "TranslateAssistant-windows-x64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath "$zipName" -Force
          Write-Host "[√] 自动化构建成功: $zipName"

      - name: Upload Artifact (测试构建下载)
        uses: actions/upload-artifact@v4
        with:
          name: TranslateAssistant-build
          path: dist/

      - name: Create GitHub Release (打标签时自动发布)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TranslateAssistant-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
