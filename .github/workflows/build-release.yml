name: Build and Release TranslateAssistant

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment and Compile
        shell: pwsh
        run: |
          Write-Host "[*] 正在准备构建环境..."
          New-Item -ItemType Directory -Path "dist", "tools" -Force | Out-Null

          # 1. 下载官方便携版 AutoHotkey v2
          Write-Host "[*] 下载 AutoHotkey v2 内核..."
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/ahk-v2.zip" -OutFile "tools/ahk.zip" -UseBasicParsing
          Expand-Archive -Path "tools/ahk.zip" -DestinationPath "tools/ahk" -Force

          # 2. 下载官方 Ahk2Exe 编译器
          Write-Host "[*] 下载 Ahk2Exe 编译工具..."
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip" -OutFile "tools/compiler.zip" -UseBasicParsing
          Expand-Archive -Path "tools/compiler.zip" -DestinationPath "tools/compiler" -Force

          # 3. 执行编译打包
          Write-Host "[*] 正在将 TranslateAssistant.ah2 编译为单文件 exe..."
          $compiler = "tools/compiler/Ahk2Exe.exe"
          $baseAhk = "tools/ahk/AutoHotkey64.exe"
          
          & $compiler /in "TranslateAssistant.ah2" /out "dist/TranslateAssistant.exe" /base "$baseAhk"

          # 4. 拷贝配置文件到发布包中
          Copy-Item "config.ini" -Destination "dist/config.ini" -Force

          # 5. 打包为绿色便携 zip 压缩包
          $zipName = "TranslateAssistant-windows-x64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath "$zipName" -Force
          Write-Host "[√] 自动化构建完成: $zipName"

      - name: Upload Artifact (测试构建下载)
        uses: actions/upload-artifact@v4
        with:
          name: TranslateAssistant-build
          path: dist/

      - name: Create GitHub Release (打标签时自动发布)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TranslateAssistant-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
